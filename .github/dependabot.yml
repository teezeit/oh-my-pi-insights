# Why: CI actions are pinned to commit SHAs; without this they never get updates.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    # Only devDependencies exist (typescript, @types/node); group them into one PR.
    groups:
      dev:
        patterns: ["*"]
