name: ci
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # The extension itself has no runtime dependencies; these are the
      # typechecker and node's type definitions, which the tests need too.
      - run: npm install
      # Node strips the types and runs the tests directly: no build step.
      - run: npm test
      - run: npm run typecheck
