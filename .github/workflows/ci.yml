name: ci
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      # The extension itself has no runtime dependencies; these are the
      # typechecker and node's type definitions, which the tests need too.
      - run: npm ci
      # Node strips the types and runs the tests directly: no build step.
      - run: npm test
      - run: npm run typecheck
