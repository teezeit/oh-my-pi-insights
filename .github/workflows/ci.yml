name: ci
on:
  push:
  pull_request:


permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      # The extension itself has no runtime dependencies; these are the
      # typechecker and node's type definitions, which the tests need too.
      - run: npm ci
      # Node strips the types and runs the tests directly: no build step.
      - run: npm test
      - run: npm run typecheck
